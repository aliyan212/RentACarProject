name: Multi-Platform & Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Build Universal Standalone Packages (Runs anywhere with Java)
  # --------------------------------------------------------------------------
  build-universal:
    name: Build Universal Standalone Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Standalone Packages via build-release.sh
        run: |
          chmod +x build-release.sh ./mvnw
          bash build-release.sh
          mkdir -p release-artifacts
          cp dist/*.jar release-artifacts/
          cp dist/*.zip release-artifacts/
          cp dist/*.tar.gz release-artifacts/

      - name: Upload Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-bundle
          path: release-artifacts/*

  # --------------------------------------------------------------------------
  # 3. Publish to GitHub Release
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \; || true
          ls -lh release-files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          name: Release ${{ github.ref_name || 'v1.0.1' }}
          generate_release_notes: true
          draft: false
          prerelease: false

